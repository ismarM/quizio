# Air config for backend live-reload
root = "."
tmp_dir = "tmp"

env_files = [".env"]

[build]
pre_cmd = ["go run ./cmd/server migrate"]
cmd = "go build -o ./tmp/main ./cmd/server"
bin = "tmp/main"
include_ext = ["go", "sql"]
exclude_dir = ["tmp", "vendor", "docs"]
exclude_regex = ["_test\\.go"]
stop_on_error = true

[build.windows]
cmd = "go build -o ./tmp/main.exe ./cmd/server"
bin = "tmp\\main.exe"

[log]
time = true

[misc]
clean_on_exit = true
