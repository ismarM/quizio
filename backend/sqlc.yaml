version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "migrations/*.up.sql"
    queries:
      - "internal/db/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/db/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        overrides:
          - column: "quizio.Attempt.time_taken"
            go_type: "database/sql.NullString"
