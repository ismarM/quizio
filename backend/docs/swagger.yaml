definitions:
  httpapi.AnswerDTO:
    properties:
      id:
        type: integer
      is_correct:
        type: boolean
      title:
        type: string
    type: object
  httpapi.AnswerInput:
    properties:
      is_correct:
        type: boolean
      title:
        type: string
    type: object
  httpapi.ArchiveQuizRequest:
    properties:
      is_archived:
        type: boolean
    type: object
  httpapi.AttemptAnswerInput:
    properties:
      answer_id:
        type: integer
      question_id:
        type: integer
    type: object
  httpapi.AttemptDTO:
    properties:
      id:
        type: integer
      quiz_id:
        type: integer
      start_time:
        type: string
      time_taken_seconds:
        type: integer
      user_id:
        type: integer
    type: object
  httpapi.AttemptQuestionDTO:
    properties:
      answer_id:
        type: integer
      question_id:
        type: integer
    type: object
  httpapi.AttemptResultResponse:
    properties:
      attempt:
        $ref: '#/definitions/httpapi.AttemptDTO'
      questions:
        items:
          $ref: '#/definitions/httpapi.QuestionDTO'
        type: array
      quiz:
        $ref: '#/definitions/httpapi.QuizDTO'
      responses:
        items:
          $ref: '#/definitions/httpapi.AttemptQuestionDTO'
        type: array
    type: object
  httpapi.AttemptSessionDTO:
    properties:
      attempt:
        $ref: '#/definitions/httpapi.OpenAttemptDTO'
      time_limit_seconds:
        type: integer
    type: object
  httpapi.CategoryDTO:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  httpapi.CategoryListResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/httpapi.CategoryDTO'
        type: array
    type: object
  httpapi.CreateQuestionRequest:
    properties:
      answers:
        items:
          $ref: '#/definitions/httpapi.AnswerInput'
        type: array
      title:
        type: string
      value:
        type: number
    type: object
  httpapi.CreateQuizRequest:
    properties:
      category_id:
        type: integer
      description:
        type: string
      image_url:
        type: string
      owner_id:
        type: integer
      questions:
        items:
          $ref: '#/definitions/httpapi.QuestionInput'
        type: array
      time_limit_seconds:
        type: integer
      title:
        type: string
    type: object
  httpapi.CreateUserRequest:
    properties:
      display_name:
        type: string
      email:
        type: string
      is_admin:
        type: boolean
      language:
        type: integer
      profile_picture:
        type: string
      theme:
        type: integer
    type: object
  httpapi.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  httpapi.LeaderboardEntryDTO:
    properties:
      achieved_points:
        type: number
      display_name:
        type: string
      email:
        type: string
      max_points:
        type: number
      time_taken_seconds:
        type: integer
      user_id:
        type: integer
    type: object
  httpapi.LeaderboardResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/httpapi.LeaderboardEntryDTO'
        type: array
      quiz_id:
        type: integer
    type: object
  httpapi.OpenAttemptDTO:
    properties:
      id:
        type: integer
      quiz_id:
        type: integer
      start_time:
        type: string
      user_id:
        type: integer
    type: object
  httpapi.OpenSessionsResponse:
    properties:
      attempts:
        items:
          $ref: '#/definitions/httpapi.AttemptSessionDTO'
        type: array
    type: object
  httpapi.PublishQuizRequest:
    properties:
      publish_date:
        type: string
    type: object
  httpapi.QuestionDTO:
    properties:
      answers:
        items:
          $ref: '#/definitions/httpapi.AnswerDTO'
        type: array
      id:
        type: integer
      quiz_id:
        type: integer
      title:
        type: string
      value:
        type: number
    type: object
  httpapi.QuestionInput:
    properties:
      answers:
        items:
          $ref: '#/definitions/httpapi.AnswerInput'
        type: array
      title:
        type: string
      value:
        type: number
    type: object
  httpapi.QuizAttemptDTO:
    properties:
      id_attempt:
        type: integer
      score_achieved:
        type: number
      start_time:
        type: string
      time_taken_seconds:
        type: integer
      user_email:
        type: string
      user_id:
        type: integer
    type: object
  httpapi.QuizAttemptsResponse:
    properties:
      attempts:
        items:
          $ref: '#/definitions/httpapi.QuizAttemptDTO'
        type: array
    type: object
  httpapi.QuizDTO:
    properties:
      category_id:
        type: integer
      category_name:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      image_url:
        type: string
      is_archived:
        type: boolean
      owner_id:
        type: integer
      publish_date:
        type: string
      question_count:
        type: integer
      time_limit_seconds:
        type: integer
      title:
        type: string
    type: object
  httpapi.QuizFullResponse:
    properties:
      questions:
        items:
          $ref: '#/definitions/httpapi.QuestionDTO'
        type: array
      quiz:
        $ref: '#/definitions/httpapi.QuizDTO'
    type: object
  httpapi.QuizListResponse:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      quizzes:
        items:
          $ref: '#/definitions/httpapi.QuizDTO'
        type: array
    type: object
  httpapi.QuizResponse:
    properties:
      quiz:
        $ref: '#/definitions/httpapi.QuizDTO'
    type: object
  httpapi.SubmissionSummary:
    properties:
      achieved_points:
        type: number
      max_points:
        type: number
      quiz_id:
        type: integer
      quiz_title:
        type: string
      start_time:
        type: string
      time_taken_seconds:
        type: integer
    type: object
  httpapi.SubmissionsResponse:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      results:
        items:
          $ref: '#/definitions/httpapi.SubmissionSummary'
        type: array
    type: object
  httpapi.UpdateAttemptRequest:
    properties:
      updates:
        items:
          $ref: '#/definitions/httpapi.AttemptAnswerInput'
        type: array
    type: object
  httpapi.UpdateDisplayNameRequest:
    properties:
      display_name:
        type: string
    type: object
  httpapi.UpdatePreferencesRequest:
    properties:
      language:
        type: integer
      theme:
        type: integer
    type: object
  httpapi.UpdateQuestionRequest:
    properties:
      answers:
        items:
          $ref: '#/definitions/httpapi.AnswerInput'
        type: array
      title:
        type: string
      value:
        type: number
    type: object
  httpapi.UpdateQuizRequest:
    properties:
      category_id:
        type: integer
      description:
        type: string
      image_url:
        type: string
      time_limit_seconds:
        type: integer
      title:
        type: string
    type: object
  httpapi.UpdateRoleRequest:
    properties:
      is_admin:
        type: boolean
    type: object
  httpapi.UserDTO:
    properties:
      display_name:
        type: string
      email:
        type: string
      id:
        type: integer
      is_admin:
        type: boolean
      language:
        type: integer
      profile_picture:
        type: string
      theme:
        type: integer
    type: object
  httpapi.UserResponse:
    properties:
      user:
        $ref: '#/definitions/httpapi.UserDTO'
    type: object
info:
  contact: {}
  description: REST API for Quizio.
  title: Quizio API
  version: 0.1.0
paths:
  /api/categories:
    get:
      description: Fetch all available quiz categories.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.CategoryListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Fetch all categories
      tags:
      - categories
  /api/questions/{questionId}:
    delete:
      description: Delete a question (quiz not published).
      parameters:
      - description: Question ID
        in: path
        name: questionId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Delete question
      tags:
      - questions
    put:
      consumes:
      - application/json
      description: Update a question and optionally its answers (quiz not published).
      parameters:
      - description: Question ID
        in: path
        name: questionId
        required: true
        type: integer
      - description: Update question
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.UpdateQuestionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.QuestionDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Update question
      tags:
      - questions
  /api/quizzes:
    get:
      description: List quizzes with filters and pagination.
      parameters:
      - default: published
        description: published|not_published|archived
        in: query
        name: scope
        type: string
      - description: Filter by title
        in: query
        name: title
        type: string
      - description: Filter by owner id
        in: query
        name: owner_id
        type: integer
      - description: Only quizzes the user submitted
        in: query
        name: submitted_only
        type: boolean
      - description: Sort by category name (use 'category')
        in: query
        name: sort
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.QuizListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: List quizzes
      tags:
      - quizzes
    post:
      consumes:
      - application/json
      description: Create a quiz with questions and answers.
      parameters:
      - description: Create quiz request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.CreateQuizRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpapi.QuizFullResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Create quiz
      tags:
      - quizzes
  /api/quizzes/{quizId}:
    delete:
      description: Delete a quiz and all related data.
      parameters:
      - description: Quiz ID
        in: path
        name: quizId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Delete quiz
      tags:
      - quizzes
    get:
      description: Get the full quiz definition (only for admin/owner).
      parameters:
      - description: Quiz ID
        in: path
        name: quizId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.QuizFullResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Get full quiz
      tags:
      - quizzes
    put:
      consumes:
      - application/json
      description: Update quiz metadata (only when not published).
      parameters:
      - description: Quiz ID
        in: path
        name: quizId
        required: true
        type: integer
      - description: Update quiz
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.UpdateQuizRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.QuizResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Update quiz
      tags:
      - quizzes
  /api/quizzes/{quizId}/archive:
    patch:
      consumes:
      - application/json
      description: Archive or unarchive a quiz.
      parameters:
      - description: Quiz ID
        in: path
        name: quizId
        required: true
        type: integer
      - description: Archive quiz
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.ArchiveQuizRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.QuizResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Archive quiz
      tags:
      - quizzes
  /api/quizzes/{quizId}/attempt/{userId}:
    get:
      description: Get all questions, answers, and user responses for a specific user's
        attempt on a quiz (admin only).
      parameters:
      - description: Quiz ID
        in: path
        name: quizId
        required: true
        type: integer
      - description: User ID
        in: path
        name: userId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.AttemptResultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Get user attempt details (admin only)
      tags:
      - attempts
  /api/quizzes/{quizId}/attempts:
    get:
      description: Get attempt status for session restoration; finalize if expired.
      parameters:
      - description: Quiz ID
        in: path
        name: quizId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.AttemptResultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Get attempt status
      tags:
      - attempts
    patch:
      consumes:
      - application/json
      description: Update answers during an attempt (only while active).
      parameters:
      - description: Quiz ID
        in: path
        name: quizId
        required: true
        type: integer
      - description: Update attempt
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.UpdateAttemptRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.AttemptResultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Update attempt status
      tags:
      - attempts
    post:
      description: Start a quiz attempt (only once per user).
      parameters:
      - description: Quiz ID
        in: path
        name: quizId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpapi.AttemptResultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Start attempt
      tags:
      - attempts
  /api/quizzes/{quizId}/attempts/admin:
    get:
      description: Retrieve a list of all attempts on a quiz with start time, time
        taken, user email, and score achieved.
      parameters:
      - description: Quiz ID
        in: path
        name: quizId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.QuizAttemptsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: List all attempts for a quiz (admin only)
      tags:
      - attempts
  /api/quizzes/{quizId}/attempts/finish:
    post:
      description: Finish an attempt and return raw results.
      parameters:
      - description: Quiz ID
        in: path
        name: quizId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.AttemptResultResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Finish attempt
      tags:
      - attempts
  /api/quizzes/{quizId}/info:
    get:
      description: Get quiz info for published quizzes.
      parameters:
      - description: Quiz ID
        in: path
        name: quizId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.QuizResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Get quiz info
      tags:
      - quizzes
  /api/quizzes/{quizId}/leaderboard:
    get:
      description: Get the top performances of users for a quiz (admin only).
      parameters:
      - description: Quiz ID
        in: path
        name: quizId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.LeaderboardResponse'
        "400":
